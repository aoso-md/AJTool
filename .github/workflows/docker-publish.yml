name: Build and publish tool Docker images

# Builds the two tool Dockerfiles and publishes them to GitHub Container
# Registry (ghcr.io) — no Railway account, no local Docker, and no
# private repo access needed on Carlos' side. He just points his
# Railway service at the published image (Settings -> Source -> Deploy
# from Docker Image) using the image name printed at the end of this
# workflow's run in the Actions tab.

on:
  push:
    branches: [ main ]
    paths:
      - "tools/calculate-cpk-ppk/**"
      - "tools/run-msa-analysis/**"
      - "docker/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  calculate_cpk_ppk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/calculate_cpk_ppk.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/calculate_cpk_ppk:latest
      - run: echo "Published ghcr.io/${{ github.repository_owner }}/calculate_cpk_ppk:latest"

  run_msa_analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/run_msa_analysis.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/run_msa_analysis:latest
      - run: echo "Published ghcr.io/${{ github.repository_owner }}/run_msa_analysis:latest"
