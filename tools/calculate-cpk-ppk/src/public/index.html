<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>calculate_cpk_ppk</title>
<style>
/* =====================================================================
   Same design language as workspace/ui/styles.css:
   warm light (Claude-style) + Apple-clean spacing. Colors/fonts copied
   from that file so this tool matches the rest of the workspace.
   ===================================================================== */
:root {
  --bg: #faf9f5; --bg-soft: #f4f1ea; --panel: #ffffff; --panel-soft: #fcfbf8;
  --border: #e7e2d8; --border-strong: #d8d2c4;
  --text: #26231d; --text-soft: #57524a; --muted: #8a8375; --faint: #b3ac9d;
  --accent: #c96442; --accent-soft: #f7e8e1; --accent-text: #a34e30;
  --success: #2e7d5b; --success-soft: #e4f1ea;
  --warning: #a3782a; --warning-soft: #f7eeda;
  --critical: #b3402e; --critical-soft: #f9e6e2;
  --info: #4a7ba6; --info-soft: #e7eff6;
  --shadow-sm: 0 1px 2px rgba(38,35,29,.05);
  --shadow-md: 0 1px 3px rgba(38,35,29,.05), 0 8px 24px rgba(38,35,29,.06);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
  --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 60px; }

/* header */
.hdr { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.hdr h1 { font-family: var(--serif); font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 6px 0 26px; }
.sub b { color: var(--text-soft); font-weight: 650; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.6px; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.badge.ok { background: var(--success-soft); color: var(--success); }
.badge.bad { background: var(--critical-soft); color: var(--critical); }

/* cards */
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  padding: 20px 22px; margin-bottom: 18px;
}
.card h2 {
  font-family: var(--serif); font-size: 15px; font-weight: 650;
  margin: 0 0 14px; color: var(--text);
}

label {
  display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.9px;
  text-transform: uppercase; color: var(--muted); margin: 12px 0 6px;
}
input[type=text], input[type=number], textarea {
  width: 100%; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: var(--mono); font-size: 12.5px;
  padding: 10px 13px; outline: none; transition: border-color .18s ease, box-shadow .18s ease;
}
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 70px; line-height: 1.6; }

.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 16px; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 16px; }
@media (max-width: 640px) { .row3, .row4 { grid-template-columns: 1fr 1fr; } }

.keyrow { display: flex; gap: 10px; align-items: center; }
.keyrow input { flex: 1; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }

.actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.btn {
  border: 0; border-radius: 999px; cursor: pointer;
  font-family: var(--sans); font-size: 13.5px; font-weight: 650;
  padding: 11px 24px; transition: all .18s ease;
}
.btn.primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
.btn.primary:hover { filter: brightness(1.08); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.err { color: var(--critical); font-size: 12px; margin-top: 10px; font-weight: 600; }

/* results */
#result { display: none; }
.verdict-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.verdict-big { font-family: var(--serif); font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.verdict-big.success { color: var(--success); }
.verdict-big.critical { color: var(--critical); }

.metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
@media (max-width: 640px) { .metric-grid { grid-template-columns: 1fr 1fr; } }
.metric { background: var(--panel-soft); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
.metric .mk { font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--faint); }
.metric .mv { font-family: var(--mono); font-size: 18px; font-weight: 700; margin-top: 3px; color: var(--text); }

.recommendation {
  font-size: 13px; line-height: 1.6; color: var(--text-soft);
  border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin-bottom: 4px;
}
details summary { cursor: pointer; color: var(--muted); font-size: 11.5px; margin-top: 12px; }
pre.json {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
  padding: 13px 15px; font-family: var(--mono); font-size: 11px; line-height: 1.6;
  color: var(--text-soft); overflow: auto; max-height: 300px; margin-top: 10px;
}
.foot { color: var(--faint); font-size: 11px; margin-top: 30px; text-align: center; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>calculate_cpk_ppk</h1>
    <span id="statusBadge" class="badge">checando…</span>
  </div>
  <p class="sub">Cpk/Ppk — análisis de capacidad de proceso · Input oficial <b>MEASUREMENTS_CAPTURED</b> → Output oficial <b>CAPABILITY_BELOW_TARGET</b></p>

  <div class="card">
    <h2>Acceso</h2>
    <div class="keyrow">
      <input type="text" id="apiKey" placeholder="x-api-key">
      <label class="chk"><input type="checkbox" id="saveKey"> guardar en este navegador</label>
    </div>
  </div>

  <div class="card">
    <h2>Datos de entrada</h2>
    <div class="row3">
      <div><label>Measurement Set ID</label><input type="text" id="measurementSetId" placeholder="p.ej. MS-2026-014"></div>
      <div><label>Part Number</label><input type="text" id="partNumber" placeholder="p.ej. PN-9001"></div>
      <div><label>Característica</label><input type="text" id="characteristic" placeholder="p.ej. diámetro de flecha"></div>
      <div><label>LSL</label><input type="number" step="any" id="lsl" placeholder="límite inferior"></div>
      <div><label>USL</label><input type="number" step="any" id="usl" placeholder="límite superior"></div>
      <div><label>Target</label><input type="number" step="any" id="target" placeholder="valor nominal"></div>
      <div><label>Minimum Cpk (opcional)</label><input type="number" step="any" id="minimumCpk" placeholder="1.33 por defecto"></div>
    </div>
    <label>Mediciones (separadas por coma)</label>
    <textarea id="measurements" placeholder="p.ej. 10.01, 10.02, 9.99, 10.00, 10.01, 9.98"></textarea>

    <div class="actions">
      <button class="btn primary" onclick="runIt()">▶ Ejecutar</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div class="card" id="result">
    <h2>Resultado</h2>
    <div class="verdict-row" id="verdictBox"></div>
    <div class="metric-grid" id="metricsBox"></div>
    <div class="recommendation" id="recoBox"></div>
    <details><summary>Ver JSON técnico</summary><pre class="json" id="rawJson"></pre></details>
  </div>

  <p class="foot">POST /events · GET /health · docker/calculate_cpk_ppk.Dockerfile</p>
</div>

<script>
  const KEY_STORAGE = "cpk_ppk_api_key";
  const saved = localStorage.getItem(KEY_STORAGE);
  if (saved) { document.getElementById("apiKey").value = saved; document.getElementById("saveKey").checked = true; }

  fetch("/health").then(r => r.json()).then(h => {
    const b = document.getElementById("statusBadge");
    b.textContent = h.ok ? "en línea" : "con problemas";
    b.className = "badge " + (h.ok ? "ok" : "bad");
  }).catch(() => {
    const b = document.getElementById("statusBadge");
    b.textContent = "sin respuesta"; b.className = "badge bad";
  });

  async function runIt() {
    const errBox = document.getElementById("err");
    errBox.textContent = "";
    const key = document.getElementById("apiKey").value.trim();
    if (document.getElementById("saveKey").checked && key) localStorage.setItem(KEY_STORAGE, key);
    if (!document.getElementById("saveKey").checked) localStorage.removeItem(KEY_STORAGE);

    const measurements = document.getElementById("measurements").value
      .split(",").map(s => s.trim()).filter(Boolean).map(Number);
    const num = (id) => { const v = document.getElementById(id).value; return v === "" ? undefined : Number(v); };

    const event = {
      type: "MEASUREMENTS_CAPTURED",
      source: "calculate-cpk-ppk-frontend",
      occurredAt: new Date().toISOString(),
      payload: {
        measurementSetId: document.getElementById("measurementSetId").value,
        partNumber: document.getElementById("partNumber").value,
        characteristic: document.getElementById("characteristic").value,
        measurements: measurements,
        lsl: num("lsl"), usl: num("usl"), target: num("target"), minimumCpk: num("minimumCpk")
      }
    };

    let res, body;
    try {
      res = await fetch("/events", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, key ? { "x-api-key": key } : {}),
        body: JSON.stringify(event)
      });
      body = await res.json();
    } catch (e) { errBox.textContent = "No se pudo conectar: " + e.message; return; }

    if (res.status === 401) { errBox.textContent = "Falta el x-api-key o está mal (401)."; return; }

    document.getElementById("result").style.display = "block";
    document.getElementById("rawJson").textContent = JSON.stringify(body, null, 2);

    const verdictBox = document.getElementById("verdictBox");
    const metricsBox = document.getElementById("metricsBox");
    const recoBox = document.getElementById("recoBox");

    if (!body.ok || !body.result) {
      verdictBox.innerHTML = '<span class="verdict-big critical">' + (body.message || "Error de validación") + '</span>';
      metricsBox.innerHTML = "";
      recoBox.textContent = (body.details || []).join(" · ") || body.recommendation || "";
      return;
    }

    const r = body.result;
    const isCapable = r.verdict === "capable";
    verdictBox.innerHTML = '<span class="verdict-big ' + (isCapable ? "success" : "critical") + '">' +
      (isCapable ? "✓ Capable" : "✗ Below Target") + '</span>';
    metricsBox.innerHTML = [
      ["Cp", r.cp], ["Cpk", r.cpk], ["Mean", r.mean], ["Std Dev", r.standardDeviation],
      ["Sample Size", r.sampleSize], ["Min Cpk", r.minimumCpk]
    ].map(([l,v]) => '<div class="metric"><div class="mk">'+l+'</div><div class="mv">'+v+'</div></div>').join("");
    recoBox.textContent = r.recommendation || body.recommendation || "";
  }
</script>
</body>
</html>
